name: Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: RBAC Quality Gate (static analysis)
        run: bun run rbac:lint

      - name: Security Gate (SQL + code lint)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: bun x tsx scripts/verify-security.ts

      - name: Build (only if gates pass)
        run: bun run build
